[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Somnia Shannon Testnet RPC
[rpc_endpoints]
somnia_testnet = "https://api.infra.testnet.somnia.network/"

[etherscan]
somnia_testnet = { key = "none", url = "https://shannon-explorer.somnia.network/api" }
